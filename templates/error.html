<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>eddi</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #222;
            color: white;
            text-align: center;
            justify-content: center;
            font-size: 40px;
            font-family: 'Arial', sans-serif;
        }
        .back {
            text-align: center;
            height: 60px;
            width: 150px;
            padding: 10px 20px;
            background: rgb(100,25,25);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
            transition: transform 0.5s ease;

        }
        .back:hover {
            background: rgb(150,25,25);
            text-decoration: underline;
            transform: scale(1.2);
            transition: background 0.3s ease;
            transition: transform 0.5s ease;
        }
    </style>
</head>
<body>
 <a class="back" onclick="window.history.back();">Zurück</a>
 <h1> error</h1>
</body>
</html>
